name: Run Python UnitTests

on:
  push:
    branches: [main, 'beta/*', 'alpha/*']
  pull_request:
    branches: [main, 'beta/*', 'alpha/*']
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Checkout Repo Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            src/abbfreeathome/dev-requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install -r src/abbfreeathome/dev-requirements.txt

      - name: Install abbfreeathome Python Package
        run: |
          uv pip install .

      - name: Test with pytest
        run: |
          pytest \
            --cov=. \
            --cov-branch \
            --cov-report=xml:coverage/coverage.xml \
            --junitxml=junit/test-results.xml

      - name: Code Coverage Summary Report
        id: coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/coverage.xml
          badge: true
          format: markdown
          output: both
          fail_below_min: true
          thresholds: '100 100'

      - name: Write Coverage to Job Summary
        if: success() || steps.coverage.conclusion == 'failure'
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6.7.1
        if: success() || failure()
        with:
          report_paths: junit/test-results.xml
          check_name: JUnit Test Report (${{ matrix.python-version }})
          detailed_summary: true
          comment: false
