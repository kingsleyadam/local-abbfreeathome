name: Copilot Setup Steps

# Run automatically when this file changes so it can be validated, and allow
# manual runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job must be named `copilot-setup-steps` for Copilot to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repo Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: |
            src/abbfreeathome/dev-requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install -r src/abbfreeathome/dev-requirements.txt
          uv pip install -e .

      - name: Verify toolchain
        run: |
          python --version
          python -m pytest --version
          ruff --version
