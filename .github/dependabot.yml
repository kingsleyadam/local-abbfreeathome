version: 2
multi-ecosystem-groups:
  tooling:
    schedule:
      interval: monthly
    labels:
      - chore

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: tooling

  - package-ecosystem: pre-commit
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: tooling
